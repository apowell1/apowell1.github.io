<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Basketball -->
  <circle cx="50" cy="50" r="45" fill="#FF6B35" stroke="#1a1a1a" stroke-width="3" />
  <!-- Basketball lines -->
  <path d="M50 5 L50 95" stroke="#1a1a1a" stroke-width="2.5" />
  <path d="M5 50 L95 50" stroke="#1a1a1a" stroke-width="2.5" />
  <path d="M50 5 C25 25, 25 75, 50 95" stroke="#1a1a1a" stroke-width="2.5" fill="none" />
  <path d="M50 5 C75 25, 75 75, 50 95" stroke="#1a1a1a" stroke-width="2.5" fill="none" />
  <!-- Crossed stats bars -->
  <rect x="30" y="35" width="8" height="35" rx="2" fill="#00D4FF" transform="rotate(-15 34 52)" />
  <rect x="62" y="35" width="8" height="35" rx="2" fill="#00D4FF" transform="rotate(15 66 52)" />
  <!-- VS emblem -->
  <circle cx="50" cy="50" r="14" fill="#1a1a1a" />
  <text x="50" y="56" text-anchor="middle" fill="#FF6B35" font-size="14" font-weight="900" font-family="sans-serif">VS</text>
